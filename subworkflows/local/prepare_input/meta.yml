# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: "prepare_input"
description: |
  List the structures in each input ZIP archive, split them into chunks, renumber
  experimental structures and keep single-model, single-chain proteins within a
  residue-count range. Also fetches UniProt taxonomy for predicted structures.
keywords:
  - protein structure
  - pdb
  - alphafold
  - chunk
  - filter
components:
  - createinputzip
  - chunkbyzip
  - renumberpdb
  - filterpdb
  - getuniprot
input:
  - ch_zip_file:
      type: file
      description: |
        Channel of input ZIP archives of protein structures
        Structure: [ val(meta), path(zip) ], meta: [ id, structure_type ]
      pattern: "*.zip"
  - chunk_size:
      type: integer
      description: Maximum number of structures per chunk for validation and renumbering
  - heavy_chunk_size:
      type: integer
      description: |
        Maximum number of structures per segmentation chunk. Accepted structures are
        re-chunked within each ZIP archive from shortest to longest, longest first within a chunk
  - max_entries:
      type: integer
      description: Maximum number of structures to process, selected in ID order; null processes all
  - min_residues:
      type: integer
      description: Structures with this many amino-acid residues or fewer are rejected
  - max_residues:
      type: integer
      description: Structures with this many amino-acid residues or more are rejected
output:
  - structures:
      type: file
      description: |
        Segmentation chunks of accepted structure IDs with the ZIP archive to read them from
        (the renumbered archive for experimental structures)
        Structure: [ val(meta), path(ids), path(zip) ], meta: [ id, structure_type, chunk_id, max_residues ]
        (max_residues: residue count of the chunk's longest structure)
      pattern: "*.{txt,zip}"
  - filter_metadata:
      type: file
      description: |
        Per-chunk validation results for every structure
        Structure: [ val(meta), path(tsv) ]
      pattern: "*.filter_metadata.tsv"
  - resmaps:
      type: file
      description: |
        Per-chunk residue maps from new to original numbering (experimental structures only)
        Structure: [ val(meta), path(zip) ]
      pattern: "*.resmaps.zip"
  - renumber_errors:
      type: file
      description: |
        Per-chunk list of experimental structures that could not be renumbered
        Structure: [ val(meta), path(tsv) ]
      pattern: "*.renumber_errors.tsv"
  - uniprot:
      type: file
      description: |
        Per-chunk UniProt proteome and taxonomy data (predicted structures only)
        Structure: [ val(meta), path(tsv) ]
      pattern: "*.uniprot_data.tsv"
authors:
  - "@FernandoDuarteF"
  - "@chriswyatt1"
maintainers:
  - "@FernandoDuarteF"
  - "@chriswyatt1"
