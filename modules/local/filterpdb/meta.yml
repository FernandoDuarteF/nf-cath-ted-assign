name: "filterpdb"
description: |
  Validate structures in a ZIP archive and keep single-model, single-chain
  proteins within a residue-count range
keywords:
  - protein structure
  - pdb
  - filter
  - gemmi
tools:
  - filter_pdb_zip.py:
      description: Pipeline script that checks model and chain counts, residue names, CA atoms and length with gemmi
      homepage: https://github.com/UCLOrengoGroup/nf-cath-ted-assign
      documentation: https://github.com/UCLOrengoGroup/nf-cath-ted-assign
      tool_dev_url: https://github.com/UCLOrengoGroup/nf-cath-ted-assign/tree/dev/bin
      licence:
        - "MIT"
      identifier: ""
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'predicted_set1', structure_type:'predicted', chunk_id:0 ]`
    - ids:
        type: file
        description: File with one structure ID per line
        pattern: "*.txt"
        ontologies:
          - edam: http://edamontology.org/format_2330
    - pdb_zip:
        type: file
        description: ZIP archive containing <id>.pdb files
        pattern: "*.zip"
        ontologies:
          - edam: http://edamontology.org/format_3987
  - min_residues:
      type: integer
      description: Structures with this many amino-acid residues or fewer are rejected
  - max_residues:
      type: integer
      description: Structures with this many amino-acid residues or more are rejected
output:
  ids:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'predicted_set1', structure_type:'predicted', chunk_id:0 ]`
      - ${prefix}.filtered_ids.txt:
          type: file
          description: IDs of the accepted structures, in input order
          pattern: "*.filtered_ids.txt"
          ontologies:
            - edam: http://edamontology.org/format_2330
  metadata:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'predicted_set1', structure_type:'predicted', chunk_id:0 ]`
      - ${prefix}.filter_metadata.tsv:
          type: file
          description: |
            One row per requested structure with status (accepted/rejected), reason,
            model, chain and residue counts
          pattern: "*.filter_metadata.tsv"
          ontologies:
            - edam: http://edamontology.org/format_3475
  versions_python:
    - - ${task.process}:
          type: string
          description: The name of the process
      - python:
          type: string
          description: The name of the tool
      - 'python3 --version | sed "s/Python //"':
          type: eval
          description: The expression to obtain the version of the tool
  versions_gemmi:
    - - ${task.process}:
          type: string
          description: The name of the process
      - gemmi:
          type: string
          description: The name of the tool
      - 'python3 -c "import gemmi; print(gemmi.__version__)"':
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - python:
          type: string
          description: The name of the tool
      - 'python3 --version | sed "s/Python //"':
          type: eval
          description: The expression to obtain the version of the tool
    - - ${task.process}:
          type: string
          description: The name of the process
      - gemmi:
          type: string
          description: The name of the tool
      - 'python3 -c "import gemmi; print(gemmi.__version__)"':
          type: eval
          description: The expression to obtain the version of the tool
authors:
