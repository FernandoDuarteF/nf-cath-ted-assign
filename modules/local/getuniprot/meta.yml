name: "getuniprot"
description: Fetch UniProt proteome and taxonomy information for a list of UniProt accessions or AlphaFold DB IDs
keywords:
  - uniprot
  - taxonomy
  - alphafold
tools:
  - fetch_uniprot_data.py:
      description: Pipeline script that queries the UniProt REST API for proteome and taxonomy fields
      homepage: https://github.com/UCLOrengoGroup/nf-cath-ted-assign
      documentation: https://github.com/UCLOrengoGroup/nf-cath-ted-assign
      tool_dev_url: https://github.com/UCLOrengoGroup/nf-cath-ted-assign/tree/dev/bin
      licence:
        - "MIT"
      identifier: ""
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'predicted_set1', structure_type:'predicted', chunk_id:0 ]`
    - tsv:
        type: file
        description: Single-column file with one UniProt accession or AlphaFold DB ID per line
        pattern: "*.txt"
        ontologies:
          - edam: http://edamontology.org/format_2330
output:
  tsv:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'predicted_set1', structure_type:'predicted', chunk_id:0 ]`
      - ${prefix}.uniprot_data.tsv:
          type: file
          description: TSV of accession, proteome and taxonomy fields
          pattern: "*.uniprot_data.tsv"
          ontologies:
            - edam: http://edamontology.org/format_3475
  versions_python:
    - - ${task.process}:
          type: string
          description: The name of the process
      - python:
          type: string
          description: The name of the tool
      - 'python3 --version | sed "s/Python //"':
          type: eval
          description: The expression to obtain the version of the tool
  versions_pandas:
    - - ${task.process}:
          type: string
          description: The name of the process
      - pandas:
          type: string
          description: The name of the tool
      - 'python3 -c "import pandas; print(pandas.__version__)"':
          type: eval
          description: The expression to obtain the version of the tool
  versions_requests:
    - - ${task.process}:
          type: string
          description: The name of the process
      - requests:
          type: string
          description: The name of the tool
      - 'python3 -c "import requests; print(requests.__version__)"':
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - python:
          type: string
