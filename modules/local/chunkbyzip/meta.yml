name: "chunkbyzip"
description: Split a list of structure IDs into fixed-size chunks that never span two ZIP archives
keywords:
  - protein structure
  - chunk
  - zip
tools:
  - chunk_by_zip.py:
      description: Pipeline script that groups structure IDs by ZIP archive and writes one ID list per chunk
      homepage: https://github.com/UCLOrengoGroup/nf-cath-ted-assign
      documentation: https://github.com/UCLOrengoGroup/nf-cath-ted-assign
      tool_dev_url: https://github.com/UCLOrengoGroup/nf-cath-ted-assign/tree/dev/bin
      licence:
        - "MIT"
      identifier: ""
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'predicted_set1', structure_type:'predicted' ]`
    - tsv:
        type: file
        description: |
          TSV of structure ID and ZIP archive name, with an optional third column
          of residue counts used to order IDs within a chunk
        pattern: "*.tsv"
        ontologies:
          - edam: http://edamontology.org/format_3475
  - chunk_size:
      type: integer
      description: Maximum number of structures per chunk
output:
  tsv:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'predicted_set1', structure_type:'predicted' ]`
      - ${prefix}.tsv:
          type: file
          description: |
            TSV with header (chunk_id, chunk_file, zip_name, max_residues) describing every chunk.
            max_residues is the residue count of the chunk's longest structure, empty without residue counts
          pattern: "*.tsv"
          ontologies:
            - edam: http://edamontology.org/format_3475
  chunk_folder:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'predicted_set1', structure_type:'predicted' ]`
      - ${prefix}/*.txt:
          type: file
          description: One file of structure IDs per chunk, named <zip>_ids_mapping.<chunk_id>.txt
          pattern: "*_ids_mapping.*.txt"
          ontologies:
            - edam: http://edamontology.org/format_2330
  versions_python:
    - - ${task.process}:
          type: string
          description: The name of the process
      - python:
          type: string
          description: The name of the tool
      - 'python3 --version | sed "s/Python //"':
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - python:
          type: string
          description: The name of the tool
      - 'python3 --version | sed "s/Python //"':
          type: eval
          description: The expression to obtain the version of the tool
authors:
