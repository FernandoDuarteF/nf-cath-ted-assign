name: "createinputzip"
description: List the PDB/mmCIF structures contained in a ZIP archive
keywords:
  - protein structure
  - pdb
  - zip
tools:
  - create_input_from_zip_script.py:
      description: Pipeline script that lists structure files (.pdb, .cif) in a ZIP archive
      homepage: https://github.com/UCLOrengoGroup/nf-cath-ted-assign
      documentation: https://github.com/UCLOrengoGroup/nf-cath-ted-assign
      tool_dev_url: https://github.com/UCLOrengoGroup/nf-cath-ted-assign/tree/dev/bin
      licence:
        - "MIT"
      identifier: ""
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'predicted_set1', structure_type:'predicted' ]`
    - zip:
        type: file
        description: ZIP archive of protein structures
        pattern: "*.zip"
        ontologies:
          - edam: http://edamontology.org/format_3987
output:
  input_mapping:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'predicted_set1', structure_type:'predicted' ]`
      - ${prefix}_input_mapping.tsv:
          type: file
          description: Two-column TSV of structure ID and ZIP archive name, sorted by ID
          pattern: "*_input_mapping.tsv"
          ontologies:
            - edam: http://edamontology.org/format_3475
  versions_python:
    - - ${task.process}:
          type: string
          description: The name of the process
      - python:
          type: string
          description: The name of the tool
      - 'python3 --version | sed "s/Python //"':
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - python:
          type: string
          description: The name of the tool
      - 'python3 --version | sed "s/Python //"':
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@FernandoDuarteF"
  - "@chriswyatt1"
maintainers:
  - "@FernandoDuarteF"
  - "@chriswyatt1"
