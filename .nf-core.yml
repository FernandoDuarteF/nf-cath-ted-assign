repository_type: pipeline

nf_core_version: 4.1.0

lint:
  files_exist:
    - conf/igenomes.config
    - conf/igenomes_ignored.config
  # Logo PNG rendering differs between machines (macOS vs CI runner), so the byte comparison is not reproducible
  files_unchanged:
    - assets/nf-core-cathtedassign_logo_light.png
    - docs/images/nf-core-cathtedassign_logo_light.png
    - docs/images/nf-core-cathtedassign_logo_dark.png

template:
  org: nf-core
  name: cathtedassign
  description: Consensus domain annotation pipeline for protein structures
  author: Chris Wyatt, Fernando Duarte, Ian Sillitoe, Nick Edmunds
  version: 1.0.0dev
  force: true
  outdir: .
  skip_features:
    - igenomes
    - fastqc
    - gpu
  is_nfcore: true
